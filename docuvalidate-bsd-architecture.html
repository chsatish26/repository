<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuValidate - Business Solution Design Architecture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0f0f2a 100%);
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .header p {
            color: #64748b;
            font-size: 1rem;
        }
        .header .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .arch-wrapper {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid;
        }
        .legend-line {
            width: 30px;
            height: 3px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DocuValidate</h1>
            <p>Business Solution Design Architecture</p>
            <p class="subtitle">AI/ML Governance Document Validation System | Multi-Agent Architecture on AWS</p>
        </div>
        
        <div class="arch-wrapper">
            <svg viewBox="0 0 1500 950" style="width: 100%; height: auto;">

                        <stop offset="100%" stop-color="rgba(59,130,246,0.03)"/>

                            <feMergeNode in="SourceGraphic"/>
